# HPO Configuration for Aegear Training
# This file defines the hyperparameter search space for optimization

# Search space parameters
# Each parameter can have:
#   - values: list of discrete values to try
#   - range: [min, max, step] for continuous parameters
#   - type: discrete, continuous, or categorical

search_space:
  lr:
    values: [0.001, 0.003]
    description: "Base learning rate"

  batch_size:
    values: [128, 256, 512]
    description: "Batch size for training"

  weight_decay:
    values: [0.0001, 0.00001]
    description: "L2 regularization weight decay"

  scheduler_type:
    values: ["OneCycleLR"]
    description: "Learning rate scheduler type"

  cbam:
    values: [true]
    description: "Enable CBAM attention mechanism"

  activation:
    values: ["silu", "gelu"]
    description: "Activation function to use in the model"

  gaussian_sigma:
    values: [8.0, 15.0, 20.0]
    description: "Sigma for Gaussian heatmap generation"

  # Loss function weights
  pos_weight:
    values: [10.0, 15.0, 20.0]
    description: "Weight for positive region in BCE loss"

  centroid_weight:
    values: [0.0025, 0.005, 0.01]
    description: "Weight for centroid distance loss"

  sparsity_weight:
    values: [0.001, 0.0025, 0.005]
    description: "Weight for sparsity regularization loss"

  dice_weight:
    values: [0.5, 1.0, 2.0]
    description: "Weight for Dice loss"

# Training configuration
training:
  epochs: 10
  num_workers: 6
  model_type: "efficient_unet"
  branch: "hpo"

# RunPod configuration
runpod:
  gpu_type: "NVIDIA GeForce RTX 3090" # Primary GPU type - will fallback to RTX 4090 then RTX 5090 if unavailable
  docker_image: "docker.io/ljubobratovicrelja/aegear:latest"
  volume_size: 10
  container_disk_size: 8

# ClearML configuration
clearml:
  project_name: "aegear-hpo"

# Optimization settings
optimization:
  objective_metric: "within_5px" # Metric to optimize
  max_tests: null # Maximum number of experiments (null = all combinations)
