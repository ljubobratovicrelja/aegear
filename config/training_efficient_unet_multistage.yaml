# Training Configuration with Multi-Stage Training
# This example shows how to use training stages for progressive fine-tuning

# Training configuration
training:
  task_name: "efficient_unet_multistage_{datetime}"
  model_type: "efficient_unet"
  branch: "main"
  data_manifest: "/workspace/data/manifest.json"
  model_dir: "/workspace/models/efficient_unet"
  checkpoint_dir: "/workspace/models/efficient_unet/checkpoints"

  batch_size: 256
  num_workers: 6

# Model and training parameters
parameters:
  # Note: epochs and lr from here are NOT used when training_stages is defined
  # They are only fallback values if training_stages is not specified

  # Optimizer settings
  weight_decay: 0.00001

  # Scheduler settings
  scheduler_type: "OneCycleLR"
  scheduler_params: "max_lr=0.005,anneal_strategy=cos"

  # Model architecture
  activation: "gelu"
  cbam: false

  # Data preprocessing
  gaussian_sigma: 8.0

  # Loss function weights
  loss_params: "pos_weight=2.0,centroid_weight=0.1,sparsity_weight=0.1,dice_weight=1.0"

  # Training options
  device: "cuda"
  autodownload: true
  use_visualizer: true
  verbose: true

# Training stages - Progressive unfreezing strategy
training_stages:
  stages:
    # Stage 1: Train decoder only with frozen encoder
    # This helps the decoder learn good initial features
    - name: "Stage 1 - Decoder training"
      freeze_layers: ["enc1", "enc2", "enc3", "enc4"]
      epochs: 10
      lr: 0.005 # Higher LR for initial training

    # Stage 2: Unfreeze upper encoder layers
    # Fine-tune with moderate learning rate
    - name: "Stage 2 - Upper layer fine-tuning"
      freeze_layers: ["enc1", "enc2"] # Keep lower layers frozen
      epochs: 8
      lr: 0.002 # Moderate LR

    # Stage 3: Fine-tune entire network
    # Final polish with low learning rate
    - name: "Stage 3 - Full network fine-tuning"
      freeze_layers: [] # No layers frozen
      epochs: 7
      lr: 0.0005 # Low LR for fine-tuning

# RunPod configuration
runpod:
  gpu_type: "NVIDIA GeForce RTX 3090"
  gpu_count: 1
  docker_image: "docker.io/ljubobratovicrelja/aegear:latest"
  volume_size: 10
  container_disk_size: 8
  monitor: true
  auto_terminate: true
  check_interval: 60
  timeout_hours: 24

# ClearML configuration
clearml:
  project_name: "aegear-efficient-unet-multistage"
