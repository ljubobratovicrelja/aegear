[project]
name = "aegear"
version = "0.4.0"
description = "Computer vision toolkit for fish tracking and behavioral analysis in aquaculture research environments."
authors = [
    { name = "Relja Ljubobratovic", email = "ljubobratovic.relja@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=2.3.5",
    "opencv-contrib-python>=4.11.0.86",
    "opencv-python>=4.11.0.86",
    "Pillow>=12.0.0",
    "scipy>=1.11.0",
    "torch>=2.9",
    "torchvision>=0.24",
]

[project.optional-dependencies]
train = [
    "tqdm>=4.65.0",
    "google-cloud-storage>=3.5.0",
    "webdataset>=1.0.2",
    "hpbandster>=0.7.4",
]

dev = [
    "kornia>=0.8.0",
    "tensorboard>=2.19.0",
    "ipykernel>=7.1.0",
    "gdown>=5.0.0",
    "ipywidgets>=8.0.0",
    "scikit-learn>=1.6.0",
    "fiftyone>=1.10.0",
    "clearml>=2.0.0",
    "tqdm>=4.65.0",
    "google-cloud-storage>=3.5.0",
    "webdataset>=1.0.2",
]

[project.urls]
Homepage = "https://ljubobratovicrelja.github.io/aegear/"
Repository = "https://github.com/ljubobratovicrelja/aegear"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
aegear-gui = "aegear.app:main"
